<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061E29" />
      <stop offset="50%" stop-color="#143644" />
      <stop offset="100%" stop-color="#1D546D" />
    </linearGradient>
    <linearGradient id="rAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#619DC6" />
      <stop offset="100%" stop-color="#5F9598" />
    </linearGradient>
    <filter id="rShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#rBg)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#619DC6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(60, 45)" filter="url(#rShadow)">
    <!-- Header -->
    <rect width="680" height="410" rx="14" fill="#0D2533" stroke="#619DC6" stroke-width="1.5" stroke-opacity="0.3" />
    <rect width="680" height="42" rx="14" fill="#061E29" />
    <!-- Window controls -->
    <circle cx="25" cy="21" r="5.5" fill="#F4BAA3" />
    <circle cx="43" cy="21" r="5.5" fill="#5F9598" />
    <circle cx="61" cy="21" r="5.5" fill="#619DC6" />
    
    <!-- URL pill -->
    <rect x="180" y="9" width="320" height="24" rx="12" fill="#143644" />
    <text x="340" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#A6C8E2" text-anchor="middle">https://replya.ai-app.internal</text>

    <!-- Sidebar in UI -->
    <rect x="0" y="42" width="160" height="368" fill="#09202D" />
    <rect x="18" y="65" width="124" height="26" rx="6" fill="#1D546D" />
    <text x="30" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F4F0E2">✨ AI Copilot</text>
    
    <rect x="18" y="105" width="100" height="12" rx="3" fill="#1D546D" opacity="0.6" />
    <rect x="18" y="125" width="115" height="12" rx="3" fill="#1D546D" opacity="0.4" />
    <rect x="18" y="145" width="85" height="12" rx="3" fill="#1D546D" opacity="0.4" />
    <rect x="18" y="165" width="110" height="12" rx="3" fill="#1D546D" opacity="0.4" />

    <!-- Main Content Area -->
    <text x="195" y="85" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#F4F0E2">Replya AI Assistant</text>
    <text x="195" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#A6C8E2">Intelligent business communications &amp; multi-channel message dispatcher</text>

    <!-- Chat Cards / Message Streams -->
    <!-- Incoming message -->
    <rect x="195" y="135" width="330" height="60" rx="10" fill="#143644" stroke="#619DC6" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="220" cy="165" r="14" fill="#1D546D" />
    <text x="220" y="169" font-family="system-ui, sans-serif" font-size="11" fill="#A6C8E2" text-anchor="middle">CL</text>
    <text x="245" y="157" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F4F0E2">Client Inquiry #4102</text>
    <text x="245" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#A6C8E2">"Can we automate our customer onboarding workflows?"</text>

    <!-- AI Generated Reply -->
    <rect x="250" y="210" width="395" height="95" rx="10" fill="#1D546D" stroke="#5F9598" stroke-width="1.5" />
    <circle cx="280" cy="240" r="14" fill="url(#rAcc)" />
    <text x="280" y="244" font-family="system-ui, sans-serif" font-size="12" fill="#061E29" text-anchor="middle">✦</text>
    <text x="305" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F4BAA3">Replya AI Suggestion (99.4% Match)</text>
    <text x="305" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#F4F0E2">"Yes! With Supabase realtime pipelines and our Next.js</text>
    <text x="305" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#F4F0E2">webhooks, onboarding can trigger automated intelligent email sequences."</text>
    <rect x="305" y="285" width="90" height="15" rx="4" fill="#5F9598" />
    <text x="350" y="296" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#061E29" text-anchor="middle">One-Click Dispatch</text>

    <!-- Metrics Bar -->
    <rect x="195" y="325" width="140" height="60" rx="8" fill="#143644" />
    <text x="210" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Avg Response Time</text>
    <text x="210" y="372" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#5F9598">1.2s</text>

    <rect x="350" y="325" width="140" height="60" rx="8" fill="#143644" />
    <text x="365" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Resolved Inquiries</text>
    <text x="365" y="372" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#619DC6">98.8%</text>

    <rect x="505" y="325" width="140" height="60" rx="8" fill="#143644" />
    <text x="520" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Supabase Sync</text>
    <text x="520" y="372" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#F4BAA3">Live Realtime</text>
  </g>
</svg>