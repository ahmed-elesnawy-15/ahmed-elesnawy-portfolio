<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D546D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#061E29" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#143c4f" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4BAA3" />
      <stop offset="100%" stop-color="#e29b80" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#619DC6" />
      <stop offset="100%" stop-color="#5F9598" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="700" rx="36" fill="url(#bgGrad)" />

  <!-- Abstract Tech Grid Lines -->
  <path d="M 50 150 L 550 150 M 50 350 L 550 350 M 50 550 L 550 550" stroke="#619DC6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6,6" />
  <path d="M 150 50 L 150 650 M 300 50 L 300 650 M 450 50 L 450 650" stroke="#619DC6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- Ambient Glow Behind Avatar -->
  <circle cx="300" cy="310" r="170" fill="url(#accentGrad)" opacity="0.35" filter="url(#softGlow)" />

  <!-- Modern Avatar Illustration -->
  <!-- Shoulders & Coat -->
  <path d="M 170 650 C 170 510, 230 470, 300 470 C 370 470, 430 510, 430 650 Z" fill="#1D546D" />
  <path d="M 230 490 L 300 590 L 370 490 Z" fill="#A6C8E2" opacity="0.9" />
  <path d="M 260 510 L 300 620 L 340 510 Z" fill="#F4F0E2" />

  <!-- Neck -->
  <rect x="270" y="380" width="60" height="80" rx="10" fill="url(#skinGrad)" />
  <path d="M 270 420 Q 300 450 330 420 Z" fill="#cf866c" opacity="0.4" />

  <!-- Head / Face -->
  <ellipse cx="300" cy="300" rx="90" ry="110" fill="url(#skinGrad)" />
  
  <!-- Ears -->
  <ellipse cx="205" cy="305" rx="15" ry="24" fill="url(#skinGrad)" />
  <ellipse cx="395" cy="305" rx="15" ry="24" fill="url(#skinGrad)" />

  <!-- Modern Hair -->
  <path d="M 210 270 C 205 180, 395 180, 390 270 C 370 230, 340 215, 300 215 C 255 215, 230 235, 210 270 Z" fill="#0A1820" />
  <path d="M 220 220 C 270 170, 330 170, 380 215 C 340 190, 270 190, 220 220 Z" fill="#1D546D" opacity="0.6" />

  <!-- Glasses (Modern Developer Look) -->
  <rect x="230" y="275" width="55" height="40" rx="10" fill="none" stroke="#061E29" stroke-width="6" />
  <rect x="315" y="275" width="55" height="40" rx="10" fill="none" stroke="#061E29" stroke-width="6" />
  <line x1="285" y1="295" x2="315" y2="295" stroke="#061E29" stroke-width="5" />
  <line x1="210" y1="285" x2="230" y2="290" stroke="#061E29" stroke-width="4" />
  <line x1="370" y1="290" x2="390" y2="285" stroke="#061E29" stroke-width="4" />

  <!-- Eyes behind glasses -->
  <ellipse cx="258" cy="295" rx="7" ry="6" fill="#061E29" />
  <ellipse cx="342" cy="295" rx="7" ry="6" fill="#061E29" />
  <circle cx="260" cy="293" r="2" fill="#ffffff" />
  <circle cx="344" cy="293" r="2" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 230 260 Q 260 252 285 262" stroke="#0A1820" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 315 262 Q 340 252 370 260" stroke="#0A1820" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 300 295 L 295 330 L 306 332" stroke="#cf866c" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Friendly Confident Smile -->
  <path d="M 275 355 Q 300 375 325 355" stroke="#061E29" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Neatly Groomed Beard / Stubble -->
  <path d="M 245 325 C 245 395, 355 395, 355 325 C 340 370, 260 370, 245 325 Z" fill="#0A1820" opacity="0.35" />

  <!-- Code Badge Overlays -->
  <g transform="translate(40, 480)">
    <rect width="180" height="52" rx="14" fill="#061E29" stroke="#619DC6" stroke-width="2" opacity="0.95" />
    <circle cx="28" cy="26" r="10" fill="#619DC6" />
    <text x="28" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#061E29" text-anchor="middle">&lt;/&gt;</text>
    <text x="50" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F4F0E2">MEAN Stack</text>
    <text x="50" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Full-Stack Specialist</text>
  </g>

  <g transform="translate(390, 140)">
    <rect width="170" height="48" rx="14" fill="#061E29" stroke="#5F9598" stroke-width="2" opacity="0.95" />
    <circle cx="24" cy="24" r="8" fill="#5F9598" />
    <text x="42" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F4F0E2">Ahmed Sabry</text>
    <text x="42" y="37" font-family="system-ui, sans-serif" font-size="10" fill="#F4BAA3">Computer Science</text>
  </g>

  <g transform="translate(370, 560)">
    <rect width="190" height="52" rx="14" fill="#1D546D" stroke="#F4BAA3" stroke-width="2" opacity="0.95" />
    <text x="18" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F4F0E2">Available for Work</text>
    <text x="18" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#F4BAA3">● Open to Opportunities</text>
  </g>
</svg>