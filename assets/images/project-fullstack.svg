<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061E29" />
      <stop offset="100%" stop-color="#143644" />
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#mBg)" />

  <g transform="translate(60, 45)" filter="url(#mShadow)">
    <rect width="680" height="410" rx="14" fill="#0A1D27" stroke="#5F9598" stroke-width="1.5" />
    <!-- Browser Top Bar -->
    <rect width="680" height="42" rx="14" fill="#061E29" />
    <circle cx="25" cy="21" r="5.5" fill="#F4BAA3" />
    <circle cx="43" cy="21" r="5.5" fill="#5F9598" />
    <circle cx="61" cy="21" r="5.5" fill="#619DC6" />
    
    <rect x="180" y="9" width="320" height="24" rx="12" fill="#143644" />
    <text x="340" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#A6C8E2" text-anchor="middle">https://mean-enterprise-portal.internal</text>

    <!-- Top Dashboard Bar -->
    <text x="35" y="80" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#F4F0E2">MEAN Stack Enterprise Portal</text>
    <text x="35" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#A6C8E2">Angular 17 • Node.js REST API • Express.js • MongoDB Atlas Database</text>

    <!-- 4 Pipeline Blocks for M-E-A-N -->
    <!-- MongoDB -->
    <g transform="translate(35, 125)">
      <rect width="145" height="110" rx="10" fill="#143644" stroke="#5F9598" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#1D546D" />
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#5F9598" text-anchor="middle">M</text>
      <text x="60" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F0E2">MongoDB</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Aggregations, NoSQL</text>
      <text x="20" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Mongoose Schemas</text>
      <rect x="20" y="100" width="105" height="4" rx="2" fill="#5F9598" />
    </g>

    <!-- Express -->
    <g transform="translate(195, 125)">
      <rect width="145" height="110" rx="10" fill="#143644" stroke="#619DC6" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#1D546D" />
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#619DC6" text-anchor="middle">E</text>
      <text x="60" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F0E2">Express.js</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">REST Middleware</text>
      <text x="20" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">JWT Auth &amp; Routing</text>
      <rect x="20" y="100" width="105" height="4" rx="2" fill="#619DC6" />
    </g>

    <!-- Angular -->
    <g transform="translate(355, 125)">
      <rect width="145" height="110" rx="10" fill="#143644" stroke="#F4BAA3" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#1D546D" />
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#F4BAA3" text-anchor="middle">A</text>
      <text x="60" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F0E2">Angular</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Reactive Forms, RxJS</text>
      <text x="20" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Two-Way Data Binding</text>
      <rect x="20" y="100" width="105" height="4" rx="2" fill="#F4BAA3" />
    </g>

    <!-- Node.js -->
    <g transform="translate(515, 125)">
      <rect width="130" height="110" rx="10" fill="#143644" stroke="#5F9598" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#1D546D" />
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#5F9598" text-anchor="middle">N</text>
      <text x="60" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F0E2">Node.js</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Asynchronous I/O</text>
      <text x="20" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#A6C8E2">Microservices Backend</text>
      <rect x="20" y="100" width="90" height="4" rx="2" fill="#5F9598" />
    </g>

    <!-- Live Architecture Console Output Preview -->
    <rect x="35" y="255" width="610" height="130" rx="10" fill="#061E29" stroke="#1D546D" stroke-width="1.5" />
    <text x="50" y="280" font-family="monospace" font-size="11" fill="#5F9598">✓ [MongoDB Atlas] Connected to cluster: mongodb+srv://cluster-prod (Latency 14ms)</text>
    <text x="50" y="302" font-family="monospace" font-size="11" fill="#619DC6">✓ [Express Router] Mounted 18 endpoints under /api/v1/auth &amp; /api/v1/services</text>
    <text x="50" y="324" font-family="monospace" font-size="11" fill="#F4BAA3">✓ [Angular Client] Standalone components compiled; RxJS State Store initialized</text>
    <text x="50" y="346" font-family="monospace" font-size="11" fill="#A6C8E2">✓ [Node Engine] Server listening on port 5000 | Security Headers &amp; Rate-Limiter OK</text>
    <text x="50" y="368" font-family="monospace" font-size="11" fill="#F4F0E2">★ Full-Stack End-to-End Test Suite: 42 Passing (0 failed)</text>
  </g>
</svg>